{% extends 'base.html' %}

{% block content %}
<div class="fade-up">
    <div class="page-header">
        <div>
            <p class="eyebrow">Leave request</p>
            <h2 class="page-title">Apply for leave</h2>
            <p class="page-subtitle">Submit your request with a clear, streamlined form.</p>
        </div>
    </div>

    <div class="form-card">
        <form method="post" class="form-grid">
            {% csrf_token %}

            <div class="floating-field">
                <input type="date" name="start_date" id="start_date" required>
                <label for="start_date">Start Date</label>
            </div>

            <div class="floating-field">
                <input type="date" name="end_date" id="end_date" required>
                <label for="end_date">End Date</label>
            </div>

            <div class="floating-field">
                <textarea name="reason" id="reason" rows="4" placeholder="Reason" required></textarea>
                <label for="reason">Reason</label>
            </div>

            <button class="btn btn-primary" type="submit">Apply Leave</button>
        </form>
    </div>
</div>
{% endblock %}
