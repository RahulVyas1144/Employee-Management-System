{% extends 'base.html' %}

{% block content %}
<div class="fade-up">
    <div class="page-header">
        <div>
            <p class="eyebrow">Company updates</p>
            <h2 class="page-title">Announcements</h2>
            <p class="page-subtitle">Stay informed with the latest internal updates.</p>
        </div>
    </div>

    {% for ann in announcements %}
    <div class="card" style="margin-bottom:16px;">
        <h3 style="margin-top:0;">{{ ann.title }}</h3>
        <p style="margin:0 0 8px; color:var(--muted);">{{ ann.message }}</p>
        <small style="color:var(--muted);">Posted on {{ ann.created_at }}</small>
    </div>
    {% empty %}
    <div class="card empty-state">No announcements yet.</div>
    {% endfor %}
</div>
{% endblock %}
