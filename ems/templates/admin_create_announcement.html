{% extends 'base.html' %}

{% block content %}
<div class="fade-up">
    <div class="page-header">
        <div>
            <p class="eyebrow">Communications</p>
            <h2 class="page-title">Create announcement</h2>
            <p class="page-subtitle">Publish updates that keep the team aligned.</p>
        </div>
    </div>

    <div class="form-card">
        <form method="post" class="form-grid">
            {% csrf_token %}

            <div class="floating-field">
                <input type="text" name="title" id="title" placeholder="Title" required>
                <label for="title">Title</label>
            </div>

            <div class="floating-field">
                <textarea name="message" id="message" rows="5" placeholder="Message" required></textarea>
                <label for="message">Message</label>
            </div>

            <button class="btn btn-primary" type="submit">Publish</button>
        </form>
    </div>
</div>
{% endblock %}
